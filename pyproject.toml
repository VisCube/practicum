[project]
name = "assistant"
version = "0.1.0"
description = "Голосовой ассистент 1-й линии контакт-центра УК"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rutextnorm>=2.1.0",
    "silero-stress>=1.5",
]

[project.optional-dependencies]
local = ["vosk>=0.3.45", "piper-tts>=1.2", "torch>=2.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
assistant = "assistant.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.mypy]
python_version = "3.12"
packages = ["assistant"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette", "ignore::DeprecationWarning:fastapi"]
# Основы слов: «прокуратур» найдёт «прокуратуру», «в прокуратуре»
# label — как сработавший маркер увидят оператор и дев-стенд

# Клиент просит живого человека → переводим сразу
transfer:
  - {phrase: оператор,           label: просит оператора}
  - {phrase: живого человека,    label: просит живого человека}
  - {phrase: с человеком,        label: просит живого человека}
  - {phrase: позовите человека,  label: просит живого человека}
  - {phrase: соедините,          label: просит соединить}
  - {phrase: переключите,        label: просит соединить}

# Угроза жалобы → заявка уходит с флагом, приём НЕ прерываем:
# оператору потом нужна заявка, а не оборванный на полуслове разговор
complaint:
  - {phrase: прокуратур,         label: прокуратура}
  - {phrase: гжи,                label: ГЖИ}
  - {phrase: жилищн инспекц,     label: ГЖИ}
  - {phrase: жилинспекц,         label: ГЖИ}
  - {phrase: в суд,              label: суд}
  - {phrase: роспотребнадзор,    label: Роспотребнадзор}
  - {phrase: администрац,        label: администрация}